name: collect

on:
  schedule:
    - cron: "17 3 * * *"  # daily, 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collect.txt
      - run: pip install -r requirements-collect.txt
      - name: Run the collection swarm
        run: python -m app.collect.run
      - name: Publish the dataset
        run: |
          git config user.name "probe-collector"
          git config user.email "probe-collector@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Collection run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

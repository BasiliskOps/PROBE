<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PROBE{% endblock %}</title>
  <meta name="description" content="Design a real space mission in one sentence and fly it in real time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { night: "#10163A", deep: "#0A0F2B", gold: "#E2B04A", flight: "#F1EEE6", neptune: "#7C9BE6", mars: "#C4553B", haze: "#9AA3C7" },
      fontFamily: { display: ['"Big Shoulders Display"', "sans-serif"], sans: ['"Public Sans"', "system-ui", "sans-serif"] },
    } } };
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script type="importmap">{"imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }}</script>
  <style>
    html { background: #0A0F2B; }
    body { background: #0A0F2B radial-gradient(120% 90vh at 70% 0%, #1A2257 0%, #10163A 45%, #0A0F2B 100%) no-repeat; }
    .sky-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .sky-labels span { position: absolute; left: 0; top: 0; margin: 10px 0 0 10px; font-size: 12px; color: #9AA3C7; white-space: nowrap; }
    .sky-labels span.probe { color: #E2B04A; font-weight: 600; font-size: 13px; margin: -26px 0 0 12px; }
    :focus-visible { outline: 2px solid #E2B04A; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="text-flight font-sans min-h-screen antialiased">
  {% block body %}{% endblock %}
</body>
</html>
